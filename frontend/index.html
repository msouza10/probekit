<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="canonical" href="https://probekit.cc/" />
    <script>
      ;(() => {
        let theme
        try {
          theme = localStorage.getItem("probekit-theme")
        } catch {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light"
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.classList.toggle("dark", theme === "dark")
      })()
    </script>
    <title>Probekit · Ping e consulta DNS online</title>
    <meta
      name="description"
      content="Ping e consulta DNS feitos por uma sonda em São Paulo. Um laboratório pessoal de infraestrutura, com o código aberto no GitHub."
    />

    <meta property="og:site_name" content="Probekit" />

    <meta property="og:title" content="Probekit · Ping e consulta DNS online" />
    <meta
      property="og:description"
      content="Ping e consulta DNS feitos por uma sonda em São Paulo. Um laboratório pessoal de infraestrutura, com o código aberto no GitHub."

    <meta
      property="og:image:alt"
