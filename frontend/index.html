<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <script>
      ;(() => {
        let theme
        try {
          theme = localStorage.getItem("probekit-theme")
        } catch {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light"
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.classList.toggle("dark", theme === "dark")
      })()
    </script>
    <title>Probekit · Ping e DNS a partir de São Paulo</title>
    <meta
      name="description"
      content="Ping e consulta DNS feitos por uma sonda em São Paulo. Um laboratório pessoal de infraestrutura, com o código aberto no GitHub."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Probekit" />
    <meta property="og:locale" content="pt_BR" />
    <meta
      property="og:title"
      content="Probekit · Ping e DNS a partir de São Paulo"
    />
    <meta
      property="og:description"
      content="Ping e consulta DNS feitos por uma sonda em São Paulo. Um laboratório pessoal de infraestrutura, com o código aberto no GitHub."
    />

  </body>
</html>
