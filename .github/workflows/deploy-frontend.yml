name: Deploy Frontend

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/**"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run lint
        working-directory: ./frontend
        run: |
          npm run lint

      - name: Run format check
        working-directory: ./frontend
        run: |
          npm run format:check

      - name: Run npm tests
        working-directory: ./frontend
        run: |
          npm test

      - name: Run build
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: "https://api.probekit.cc"
        run: |
          npm run build

      - name: Check API URL in the build
        working-directory: ./frontend
        run: |
          grep -rlF "https://api.probekit.cc" dist/assets > /dev/null \
            || { echo "dist/ nao contem a URL da API esperada (https://api.probekit.cc)"; exit 1; }

      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy Frontend
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}
          path: frontend/dist

      - name: Deploy Frontend
        working-directory: ./frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler deploy

      - name: Verify the site is up
        working-directory: ./infra/shellscript
        run: |
          bash verify-sites.sh

      - name: Verify the API accepts the site origin
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X OPTIONS "https://api.probekit.cc/api/ping" \
            -H "Origin: https://probekit.cc" -H "Access-Control-Request-Method: GET" || true)
          if [ "$code" != "204" ]; then
            echo "FALHOU: a API nao liberou a origem do site (preflight respondeu $code)"
            exit 1
          fi
          echo "preflight -> 204"
